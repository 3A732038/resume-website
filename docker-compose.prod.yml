# 固定 project 名為 resume-prod，與開發端 resume-dev 隔離。
# prod 接入共用 nginx（../reverse-proxy）：前端 build 成靜態檔丟共享 volume，由 nginx serve。
# 後端不再經由共用 nginx，改為獨立開 port 對外。
name: resume-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    volumes:
      - ./assets:/app/assets:ro
    env_file:
      - ./backend/.env
    # 後端獨立對外，不再經由共用 nginx 代理。用 8001，避免跟 dev 的 8000 撞埠。
    ports:
      - "8001:8000"
    # 【改走共用 nginx 代理時啟用】加入共用網路 web 並註冊別名，
    # nginx（reverse-proxy/conf.d/resume.conf）才能用 resume-prod-backend 解析到後端。
    # 啟用時：取消下面註解、取消檔案底部 networks 的註解、移除上面的 ports，
    # 並重新 build 前端（VITE_API_URL 要留空，API_BASE 才會是同源的 ''）。
    # networks:
    #   default: {}
    #   web:
    #     aliases:
    #       - resume-prod-backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes:
      # build 產物丟進共享 volume，給共用 nginx 直接 serve 
      - resume-prod-static:/output
    # build-only：跑完 cp 就結束，不常駐、不對外開 port、不需 restart，因此不需要啟動該服務，僅用於產生靜態檔。

# 【改走共用 nginx 代理時啟用】共用反向代理網路（由 reverse-proxy 那邊先建立：docker network create web）
# networks:
#   default: {}
#   web:
#     external: true

volumes:
  # 存放 prod build 出來的靜態檔，與 reverse-proxy 共用（external）
  resume-prod-static:
    external: true
