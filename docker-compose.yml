# 固定 project 名為 resume-dev，與生產端 resume-prod 隔離，
# 避免兩邊共用預設 project 名導致 image / 容器互相覆蓋。
name: resume-dev

services:
  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend:/app
      - ./assets:/app/assets:ro
    env_file:
      - ./backend/.env
    # 後端獨立對外，不再經由共用 nginx 代理，前端直接打這個 port。
    ports:
      - "8000:8000"
    # 【改走共用 nginx 代理後端時啟用】加入共用網路 web 並註冊別名，
    # nginx（reverse-proxy/conf.d/resume.conf）才能用 resume-dev-backend 解析到後端。
    # 啟用時：取消下面註解、移除上面的 ports，並移除 frontend 的 volumes 裡
    # ./frontend/.env:/app/.env 這行掛載（讓 VITE_API_URL 讀不到，API_BASE 才會是同源的 ''），
    # 再重建前端（--force-recreate，單純 restart 不會套用 volumes 變更）。
    # networks:
    #   default: {}
    #   web:
    #     aliases:
    #       - resume-dev-backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      # public/ 底下的檔案（如 favicon）由 Vite dev 直接從這裡提供，掛載後新增/替換不需重新 build。
      - ./frontend/public:/app/public
      # 讓容器內的 Vite 讀得到 VITE_API_URL（沒掛的話容器內沒有 .env，API_BASE 會是 ''）。
      - ./frontend/.env:/app/.env
      # 把 package.json 掛出來：在容器內 npm install 後，主機這份會即時同步，
      # 方便查看裝了哪些套件，也讓 git / Render build 拿到最新依賴清單。
      - ./frontend/package.json:/app/package.json
    depends_on:
      - backend
    networks:
      default: {}
      # 同上，給 nginx-proxy 跨 compose 解析前端容器用
      web:
        aliases:
          - resume-dev-frontend
    # 保留 3000 對外，方便需要時直連 Vite 除錯；日常走 http://resume-dev.localhost
    ports:
      - "3000:3000"
    restart: unless-stopped

# 不再需要專案內的 nginx —— 改由 ../reverse-proxy 的共用 nginx 統一代理

networks:
  default: {}
  # 共用反向代理網路（由 reverse-proxy 那邊先建立：docker network create web）
  web:
    external: true
